[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse"
version = "0.2.0"
description = "Graph-based resume-JD matching with explainable skill reasoning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.38.0",
    "networkx==3.2.1",
    "pypdf==4.3.1",
    "python-docx==1.1.2",
    "google-genai==1.5.0",
    "pydantic==2.9.2",
    "fastembed==0.8.0",
    "neo4j==5.26.0",
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    # See requirements.txt for why these two transitive deps are pinned.
    "websockets==14.2",
    "langsmith==0.8.5",
]

[project.optional-dependencies]
dev = [
    "google-genai==1.29.0",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "pytest==8.3.3",
    "scikit-learn==1.5.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["synapse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]